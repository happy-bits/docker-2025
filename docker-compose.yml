services:
  webapp:
    build:
      context: ./MyWebApp
      dockerfile: Dockerfile
    ports:
      - "1234:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=product_database;Username=username;Password=strong_password
    
    # depends_on:
    #   - database
    container_name: webapp

  database:
    build:
      context: ./Database
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    container_name: db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: my-postgres-data

